name: Refresh Google reviews

# Runs server-side (never in the browser). Pulls the business's live Google
# rating + review count with the official Places API (New) using repo SECRETS,
# writes the public cache assets/data/reviews.json, and commits it so GitHub
# Pages serves it. Refreshes every 4 hours (revalidation interval).
on:
  # Refresh the Google rating/review-count cache every 4 hours — the cache
  # revalidation interval (14,400 s). It only commits when the values actually
  # changed, so this stays quiet between changes. Before GOOGLE_API_KEY is added
  # it skips with a message; the site then shows no dynamic line rather than
  # fake data. Run by hand anytime from the Actions tab.
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}         # manual run from the Actions tab

permissions:
  contents: write               # needed to commit the refreshed cache

concurrency:
  group: refresh-google-reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest Google rating + review count
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
          GOOGLE_REVIEWS_PAGE_URL: ${{ secrets.GOOGLE_REVIEWS_PAGE_URL }}
        run: node scripts/fetch-google-reviews.mjs

      - name: Commit refreshed cache (only if it changed)
        run: |
          if [ -n "$(git status --porcelain assets/data/reviews.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/reviews.json
            git commit -m "chore: refresh Google reviews cache [skip ci]"
            git push
          else
            echo "No review changes to commit."
          fi
